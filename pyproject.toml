[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "BTForensic"
version = "0.1.0"
description = "Defensive read-only forensic analyzer for Chromium browser artifacts."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "tzndias"}
]
dependencies = []
keywords = ["forensics", "chromium", "browser", "sqlite", "incident-response", "dfir"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
  "Topic :: System :: Logging",
]

[project.urls]
Homepage = "https://github.com/Arthu133/BTForensic"
Repository = "https://github.com/Arthu133/BTForensic"
Issues = "https://github.com/Arthu133/BTForensic/issues"

[project.scripts]
BTForensic = "btforensic.cli:main"

[tool.setuptools.packages.find]
include = ["btforensic*"]
